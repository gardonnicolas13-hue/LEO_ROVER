# Resilience de la pile robot (2026-08-18, audit).
#
# L'unite d'origine est en Restart=no : si leo-start meurt -- disque plein,
# noeud qui plante, OOM -- la pile ne revient PAS, et le robot reste allume
# mais muet. C'est exactement ce qui avait ete observe le 21/07 quand le
# disque s'etait rempli, et l'audit du 18/08 a retrouve le disque a 97 %,
# soit 934 Mo de marge : le meme scenario etait a portee de main.
#
# Restart=on-failure et pas =always : un arret volontaire (systemctl stop,
# sortie 0) doit rester un arret. Seuls les echecs relancent.
# Le garde-fou StartLimit est essentiel : si leo-start echoue immediatement
# et en boucle (config cassee), systemd abandonne apres 5 tentatives en
# 5 minutes au lieu de marteler indefiniment -- une tempete de relances est
# un mode de panne que ce projet a deja paye cher.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10
